<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/brand-mark.svg" />
    <meta name="theme-color" content="#0F1214" />
    <title>MeghKoshaAI</title>
    <script src="/theme-init.js"></script>
    <style>
        .boot-shell { position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; gap: 20px; background: var(--color-obsidian-canvas, #0F1214); }
        .boot-shell img { width: 56px; height: 56px; animation: boot-rise .6s cubic-bezier(.16, 1, .3, 1) both; }
        .boot-shell i { position: relative; display: block; width: 120px; height: 2px; overflow: hidden; border-radius: 2px; background: var(--glass-border, rgb(255 255 255 / .16)); }
        .boot-shell i::after { content: ''; position: absolute; inset: 0; width: 40%; border-radius: 2px; background: var(--color-signal-orange, #4FA8F5); animation: boot-slide 1.1s cubic-bezier(.4, 0, .2, 1) infinite; }
        @keyframes boot-rise { from { opacity: 0; transform: translateY(8px) scale(.96); } to { opacity: 1; transform: none; } }
        @keyframes boot-slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
        @media (prefers-reduced-motion: reduce) { .boot-shell img, .boot-shell i::after { animation: none; } .boot-shell i::after { width: 100%; opacity: .5; } }
    </style>
</head>

<body>
    <div id="root">
        <div class="boot-shell" role="status" aria-label="Loading MeghKoshaAI">
            <img src="/brand-mark.svg" alt="" />
            <i aria-hidden="true"></i>
        </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
</body>

</html>
